<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClinicCare AI Agent</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }
    .wrap {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(20,40,80,.10);
      overflow: hidden;
    }
    header {
      padding: 24px;
      background: #183b73;
      color: white;
    }
    header h1 { margin: 0 0 7px; }
    header p { margin: 0; opacity: .9; }
    #chat {
      height: 430px;
      overflow-y: auto;
      padding: 22px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 15px;
      border-radius: 14px;
      margin: 10px 0;
      white-space: pre-wrap;
      line-height: 1.45;
    }
    .user {
      margin-left: auto;
      background: #dceaff;
    }
    .bot {
      background: #eef1f5;
    }
    .examples {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 22px 16px;
    }
    button.example {
      border: 1px solid #ccd5e2;
      background: white;
      border-radius: 20px;
      padding: 8px 12px;
      cursor: pointer;
    }
    form {
      display: flex;
      gap: 10px;
      padding: 18px;
      border-top: 1px solid #e6e9ef;
    }
    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccd5e2;
      border-radius: 12px;
      font-size: 16px;
    }
    button.send {
      background: #183b73;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 0 20px;
      font-weight: bold;
      cursor: pointer;
    }
    .status {
      padding: 10px 22px;
      font-size: 13px;
      color: #5e6b7d;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <h1>ClinicCare AI Agent</h1>
        <p>Find doctors • Check slots • Book • Cancel</p>
      </header>

      <div class="status" id="status">Ready</div>

      <div id="chat">
        <div class="msg bot">
          Hello! I can help you find a doctor, check available slots, book an appointment, or cancel an appointment.
        </div>
      </div>

      <div class="examples">
        <button class="example" onclick="useExample('I have a skin problem, which doctor should I see?')">Skin problem</button>
        <button class="example" onclick="useExample('Is Dr. Sharma free tomorrow evening?')">Check tomorrow</button>
        <button class="example" onclick="useExample('Book a 5 PM slot for me. I am patient P012.')">Book appointment</button>
        <button class="example" onclick="useExample('What medicine should I take for my rash?')">Out of scope</button>
      </div>

      <form id="form">
        <input id="input" placeholder="Ask ClinicCare..." autocomplete="off" />
        <button class="send" type="submit">Send</button>
      </form>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const status = document.getElementById("status");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function useExample(text) {
      input.value = text;
      input.focus();
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      status.textContent = "Agent is thinking and selecting tools...";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }

        addMessage(data.answer, "bot");
        status.textContent = "Ready";
      } catch (error) {
        addMessage("Error: " + error.message, "bot");
        status.textContent = "Error";
      }
    });
   </script>
</body>
</html>
